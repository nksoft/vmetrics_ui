name: Build and Publish

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/vmetrics_ui

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch: [aarch64, amd64, armv7]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build add-on
        uses: home-assistant/builder@master
        with:
          args: |
            --${{ matrix.arch }}
            --target vmetrics_ui
            --image "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
            --no-latest
            --tag ${{ github.event.release.tag_name }}

  merge:
    name: Merge multi-arch manifests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.release.tag_name }}" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-aarch64:${{ github.event.release.tag_name }}" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-amd64:${{ github.event.release.tag_name }}" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-armv7:${{ github.event.release.tag_name }}"
